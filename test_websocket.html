<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nekoframe — Raw WebSocket Data</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: Consolas, Monaco, "Courier New", monospace;
      padding: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #30363d;
      padding-bottom: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
    }

    .status-badge.connected {
      background: #238636;
      color: #ffffff;
    }

    .status-badge.disconnected {
      background: #da3633;
      color: #ffffff;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
    }

    button:hover {
      background: #30363d;
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 8px;
    }

    pre {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
      font-size: 13px;
      line-height: 1.5;
      overflow: auto;
      max-height: calc(100vh - 120px);
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <header>
    <div class="title-group">
      <span class="status-badge disconnected" id="status">Disconnected</span>
      <span>ws://localhost:3069</span>
    </div>
    <div class="actions">
      <button id="pause-btn" onclick="togglePause()">Pause</button>
      <button onclick="copyRaw()">Copy JSON</button>
    </div>
  </header>

  <div class="meta-bar">
    <span id="msg-count">Messages received: 0</span>
    <span id="last-updated">Last received: —</span>
  </div>

  <pre id="raw-output">Waiting for WebSocket connection...</pre>

  <script>
    const WS_URL = 'ws://localhost:3069';
    let ws = null;
    let isPaused = false;
    let messageCount = 0;
    let latestRawText = '';

    const statusEl = document.getElementById('status');
    const rawOutputEl = document.getElementById('raw-output');
    const msgCountEl = document.getElementById('msg-count');
    const lastUpdatedEl = document.getElementById('last-updated');
    const pauseBtn = document.getElementById('pause-btn');

    function connect() {
      statusEl.textContent = 'Connecting...';
      statusEl.className = 'status-badge disconnected';

      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        statusEl.textContent = 'Connected';
        statusEl.className = 'status-badge connected';
      };

      ws.onmessage = (event) => {
        messageCount++;
        msgCountEl.textContent = `Messages received: ${messageCount}`;
        lastUpdatedEl.textContent = `Last received: ${new Date().toLocaleTimeString()}`;

        if (!isPaused) {
          latestRawText = event.data;
          try {
            const parsed = JSON.parse(event.data);
            rawOutputEl.textContent = JSON.stringify(parsed, null, 2);
          } catch (e) {
            rawOutputEl.textContent = event.data;
          }
        }
      };

      ws.onclose = () => {
        statusEl.textContent = 'Disconnected (Retrying in 3s...)';
        statusEl.className = 'status-badge disconnected';
        setTimeout(connect, 3000);
      };

      ws.onerror = () => {
        statusEl.textContent = 'Connection Error';
        statusEl.className = 'status-badge disconnected';
      };
    }

    function togglePause() {
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
    }

    function copyRaw() {
      navigator.clipboard.writeText(rawOutputEl.textContent)
        .then(() => alert('Raw JSON copied to clipboard!'))
        .catch(err => console.error('Failed to copy: ', err));
    }

    connect();
  </script>

</body>

</html>
